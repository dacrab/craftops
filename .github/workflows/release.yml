name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -buildvcs=auto -ldflags="-s -w -X craftops/internal/cli.Version=${VERSION}" \
              -o "dist/craftops-${os}-${arch}" ./cmd/craftops
            done
          done
          cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform:
            - Linux AMD64: `craftops-linux-amd64`
            - Linux ARM64: `craftops-linux-arm64`
            - macOS AMD64: `craftops-darwin-amd64`
            - macOS ARM64: `craftops-darwin-arm64`

            Make it executable and move to your PATH:
            ```bash
            chmod +x craftops-*-*
            sudo mv craftops-*-* /usr/local/bin/craftops
            ```

            Or use the install script:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/dacrab/craftops/main/install.sh | bash
            ```



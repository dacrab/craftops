name: Release
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: VERSION="${GITHUB_REF#refs/tags/v}" make package

      - name: Prepare release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v header="## ${tag}" '
            /^## / {
              if (index($0, header) == 1) { found = 1; print; next }
              if (found) exit
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "Missing CHANGELOG.md section for ${tag}" >&2; exit 1; }
          printf '\n' >> release-notes.md
          cat .github/release-notes.md >> release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md

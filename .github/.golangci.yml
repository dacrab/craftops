version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable-all: false
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gosec
    - misspell
    - revive
    - bodyclose
    - unconvert
    - goconst
    - gocritic
    - perfsprint
    - intrange
    - copyloopvar
  settings:
    govet:
      enable-all: true
      disable:
        - shadow
    gosec:
      excludes:
        - G104
        - G115
        - G703
        - G704
        # G204/G304: paths and subprocess args come from the user's own TOML
        # config, and exec uses []string args (no shell), so there is no
        # untrusted input to protect against.
        - G204
        - G304
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    goconst:
      ignore-tests: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

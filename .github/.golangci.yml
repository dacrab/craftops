version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable-all: false
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - gosec
    - misspell
    - revive
    - bodyclose
    - unconvert
    - goconst
    - gocritic
    - perfsprint
    - intrange
    - copyloopvar
  settings:
    govet:
      enable-all: true
      disable:
        - shadow
    gosec:
      # G204/G304 (subprocess launched / file opened with variable input) are
      # deliberately NOT excluded: remote Modrinth data flows into file paths
      # in internal/service/mods.go. Sites where the variable legitimately
      # comes from the user's own TOML config carry narrow //nolint:gosec
      # directives instead of a repo-wide exclusion.
      excludes:
        - G104
        - G115
        - G703
        - G704
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    goconst:
      ignore-tests: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
